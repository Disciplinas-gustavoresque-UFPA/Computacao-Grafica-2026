<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Editor Vetorial — Computação Gráfica 2026</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <div id="tela-inicial">
            <h1>Editor Vetorial 2026</h1>
            <nav class="menu-opcoes">
                <button id="btn-novo-doc" class="btn-menu">Criar novo documento</button>

                <div class="grupo-opcao">
                    <label for+"select-tamanho" class"propriedade-label">Tamanho da página:</label>
                    <div class="select-wrapper">
                        <select id="select-tamanho" class="select-format">
                            <option value="livre" selected>Livre</option>
                            <option value="a4">A4 (800x1131)</option>
                            <option value="a3">A3 (1131x1600)</option>
                        </select>
                        <svg class="select-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M7 10l5 5 5-5z" />
                        </svg>
                    </div>
                </div>

                <button id="btn-abrir-arq" class="btn-menu">Abrir arquivo</button>
                <button id="btn-modelos" class="btn-menu">Modelos (templates)</button>
                <button id="btn-config" class="btn-menu">Configurações</button>
            </nav>
        </div>
        <div id="app" class="oculto">
            <!-- Painel Superior: propriedades (cor de preenchimento, cor de borda, etc.) -->
            <header id="painel-propriedades">
                <span class="propriedade-label">Preenchimento:</span>
                <input
                    type="color"
                    id="cor-preenchimento"
                    value="#4a90d9"
                    title="Cor de preenchimento"
                />

                <span class="propriedade-label">Borda:</span>
                <input
                    type="color"
                    id="cor-borda"
                    value="#1a1a2e"
                    title="Cor da borda"
                />
                <span id="zoom-indicator">Zoom: 100%</span>

                <span id="ferramenta-atual-label"
                    >Ferramenta:
                    <strong id="nome-ferramenta">Nenhuma</strong></span
                >

                <!-- Controle de Camadas -->
                <div class="layer-controls">
                    <button id="btn-send-to-back" title="Enviar para o Fundo" class="btn-layer">⏮</button>
                    <button id="btn-step-backward" title="Recuar" class="btn-layer">⏪</button>
                    <button id="btn-step-forward" title="Avançar" class="btn-layer">⏩</button>
                    <button id="btn-bring-to-front" title="Trazer para a Frente" class="btn-layer">⏭</button>
                </div>

                <!-- Painel de Alinhamento (visível apenas com múltiplos objetos selecionados) -->
                <div id="painel-alinhamento" class="painel-alinhamento oculto">
                    <span class="propriedade-label align-label">Alinhar:</span>
                    <div class="align-group">
                        <!-- Horizontal -->
                        <button id="btn-alinhar-esquerda"   class="btn-align" title="Alinhar à Esquerda">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="4" width="2" height="12"/><rect x="4" y="6" width="8" height="3"/><rect x="4" y="11" width="12" height="3"/></svg>
                        </button>
                        <button id="btn-alinhar-centro-h"   class="btn-align" title="Centralizar Horizontalmente">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="9" y="2" width="2" height="16"/><rect x="4" y="5" width="12" height="3"/><rect x="6" y="12" width="8" height="3"/></svg>
                        </button>
                        <button id="btn-alinhar-direita"    class="btn-align" title="Alinhar à Direita">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="16" y="4" width="2" height="12"/><rect x="8" y="6" width="8" height="3"/><rect x="4" y="11" width="12" height="3"/></svg>
                        </button>
                        <div class="align-separator"></div>
                        <!-- Vertical -->
                        <button id="btn-alinhar-topo"       class="btn-align" title="Alinhar ao Topo">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="2" width="12" height="2"/><rect x="6" y="4" width="3" height="8"/><rect x="11" y="4" width="3" height="12"/></svg>
                        </button>
                        <button id="btn-alinhar-centro-v"   class="btn-align" title="Centralizar Verticalmente">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="9" width="16" height="2"/><rect x="5" y="4" width="3" height="12"/><rect x="12" y="6" width="3" height="8"/></svg>
                        </button>
                        <button id="btn-alinhar-base"       class="btn-align" title="Alinhar à Base">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="16" width="12" height="2"/><rect x="6" y="8" width="3" height="8"/><rect x="11" y="4" width="3" height="12"/></svg>
                        </button>
                        <div class="align-separator"></div>
                        <!-- Distribuição -->
                        <button id="btn-distribuir-h"       class="btn-align" title="Distribuir Horizontalmente (mín. 3)">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2" y="4" width="2" height="12"/><rect x="16" y="4" width="2" height="12"/><rect x="8" y="6" width="4" height="8"/></svg>
                        </button>
                        <button id="btn-distribuir-v"       class="btn-align" title="Distribuir Verticalmente (mín. 3)">
                            <svg viewBox="0 0 20 20" fill="currentColor"><rect x="4" y="2" width="12" height="2"/><rect x="4" y="16" width="12" height="2"/><rect x="6" y="8" width="8" height="4"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Botão de exportar/descarregar desenho -->
                <label for="export-format" class="propriedade-label"
                    >Exportar:</label
                >
                <div class="select-wrapper">
                    <select
                        class="select-format"
                        id="export-format"
                        title="Formato de exportação"
                    >
                        <option value="png" selected>PNG</option>
                        <option value="jpg">JPG</option>
                        <option value="svg">SVG</option>
                    </select>

                    <svg
                        class="select-arrow"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path d="M7 10l5 5 5-5z" />
                    </svg>
                </div>
                <button
                    class="btn-exportar"
                    id="btn-exportar"
                    title="Salvar/Exportar desenho"
                >
                    Baixar 💾
                </button>
            </header>

            <div id="workspace">
                <!-- Barra Lateral: botões das ferramentas de desenho -->
                <aside id="barra-ferramentas">
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="selecao"
                        title="Seleção (S)"
                    >
                        &#9654;
                    </button>
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="edicaoVertices"
                        title="Edição por Vértices (E-V)"
                    >
                        &#9688;
                    </button>
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="retangulo"
                        title="Retângulo (R)"
                    >
                        &#9645;
                    </button>
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="elipse"
                        title="Elipse (E)"
                    >
                        &#9711;
                    </button>
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="linha"
                        title="Linha (L)"
                    >
                        &#9135;
                    </button>
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="texto"
                        title="Texto (T)"
                    >
                        T
                    </button>
                    <button
                        class="btn-ferramenta"
                        data-ferramenta="Conta-gotas"
                        title="Conta-gotas"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="lucide lucide-pipette-icon lucide-pipette"
                        >
                            <path
                                d="m12 9-8.414 8.414A2 2 0 0 0 3 18.828v1.344a2 2 0 0 1-.586 1.414A2 2 0 0 1 3.828 21h1.344a2 2 0 0 0 1.414-.586L15 12"
                            />
                            <path
                                d="m18 9 .4.4a1 1 0 1 1-3 3l-3.8-3.8a1 1 0 1 1 3-3l.4.4 3.4-3.4a1 1 0 1 1 3 3z"
                            />
                            <path d="m2 22 .414-.414" />
                        </svg>
                    </button>
                    <button class="btn-ferramenta" data-ferramenta="borracha" title="Borracha (B)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 20H7L3 16L14 5L21 12L13 20"/>
                        </svg>
                    </button>

                    <button id="btn-zoom-click" class="btn-ferramenta" data-ferramenta="lupa" title="Zoom padrão">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                          viewBox="0 0 24 24" fill="none"
                          stroke="currentColor" stroke-width="2"
                          stroke-linecap="round" stroke-linejoin="round">

                          <!-- lente -->
                          <circle cx="11" cy="11" r="7"></circle>
                          <!-- cabo -->
                          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

                        </svg>
                      </button>
                      <div id="zoom-options" class="hidden"></div> <!-- Menu de opçoes para a lupa/zoom -->
                    <button
                        class="btn-ferramenta"
                        id="btn-importar-imagem"
                        title="Importar Imagem (Raster)"
                    >
                        🖼️
                    </button>

                    <input 
                        type="file" 
                        id="input-imagem" 
                        accept="image/png, image/jpeg, image/svg+xml" 
                        style="display: none;" 
                    />
                </aside>

                <!-- Área Central de Desenho -->
                <main id="area-desenho">
                    <svg
                        id="canvas"
                        xmlns="http://www.w3.org/2000/svg"
                        width="100%"
                        height="100%"
                        aria-label="Área de desenho vetorial"
                    >
                        <!-- Os elementos SVG criados pelo usuário serão inseridos aqui -->
                    </svg>
                </main>
            </div><!-- /#workspace -->
        </div><!-- /#app -->


  <!-- Ponto de entrada da aplicação: ES6 Module -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
